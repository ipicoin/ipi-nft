<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">IPI NFT — Physical objects. Cryptographic identity.</title>
  <desc id="desc">A secure chip connected to an NFT on the IPI blockchain.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07151f"/><stop offset="1" stop-color="#142c3b"/></linearGradient>
    <linearGradient id="chip" x2="1" y2="1"><stop stop-color="#8affe0"/><stop offset="1" stop-color="#58b9ff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8affe0" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="64" y="84" fill="#8affe0" font-size="15" letter-spacing="4">IPI · COSMOS · CW721</text>
    <text x="60" y="165" fill="#f1f7fa" font-size="70" font-weight="750" letter-spacing="-2">IPI NFT</text>
    <text x="64" y="219" fill="#e0ebf2" font-size="25">Physical objects. Cryptographic identity.</text>
    <text x="64" y="272" fill="#94adbd" font-size="17">Keys stay in the chip. Ownership lives on IPI.</text>
  </g>
