name: Verify IPI NFT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipi-nft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript, protocol, reader and CLI tests
        run: npm test
      - name: Rust formatting, Clippy and contract tests
        run: npm run test:contract
      - name: Generate and check the committed contract ABI
        shell: bash
        run: |
          npm run schema
          git diff --exit-code -- schema
          test -z "$(git ls-files --others --exclude-standard -- schema)"
      - name: Build and execute the optimized Wasm
        run: npm run build:contract
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipi-nft-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ipi_nft.wasm
            artifacts/checksums.txt
            artifacts/release.json
